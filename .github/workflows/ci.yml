name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check pyRunOF tests/unit
      - run: uv run mypy
      - run: uv run pytest --cov=pyRunOF --cov-report=term-missing
      - run: uv build
